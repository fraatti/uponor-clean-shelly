<!doctype html>
<html lang="fi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Uponor Clean</title>
<meta name="description" content="Uponor Clean I -puhdistamon livetiedot ja tehohistoria suoraan Shellystä">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect x='3' y='9' width='26' height='18' rx='6' fill='%232D8CE0'/%3E%3Crect x='3' y='9' width='26' height='7' rx='3' fill='%23d7e8f8'/%3E%3C/svg%3E">
<!-- Uponor Clean I browser app (github.com/fraatti/uponor-clean-shelly). Reads the Shelly script v3
     over the Shelly WebSocket RPC in the home network: the state with Script.Eval, the live power,
     the script's "uponor" events and the power history stored on the Shelly (EM1Data). -->
<style>
:root {
  --bg: #f2f3f5; --card: #ffffff; --fg: #1d2127; --muted: #69707a; --line: #e3e5e9; --soft: #f6f7f9;
  --accent: #2D8CE0; --power: #d64541; --ok: #2e9b55; --warn: #d9822b; --bad: #d64541;
  --shadow: 0 1px 2px rgba(0,0,0,.05), 0 2px 8px rgba(0,0,0,.04);
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #111317; --card: #1b1e24; --fg: #e7e9ec; --muted: #9aa1ab; --line: #2c3038; --soft: #22262d;
    --accent: #4aa3ee; --power: #f0625d; --shadow: none; color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #111317; --card: #1b1e24; --fg: #e7e9ec; --muted: #9aa1ab; --line: #2c3038; --soft: #22262d;
  --accent: #4aa3ee; --power: #f0625d; --shadow: none; color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { margin: 0; }
body { background: var(--bg); color: var(--fg); font: 15px/1.45 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; -webkit-text-size-adjust: 100%; }
button, input, select { font: inherit; color: inherit; }
.wrap { max-width: 1120px; margin: 0 auto; padding: 16px; }
header { display: flex; align-items: center; gap: 12px; margin-bottom: 14px; }
header h1 { font-size: 20px; margin: 0; font-weight: 650; letter-spacing: -.01em; }
@media (max-width: 520px) { header h1 { font-size: 18px; white-space: nowrap; } .conn .host { display: none; } }
.conn { margin-left: auto; display: flex; align-items: center; gap: 8px; color: var(--muted); font-size: 13px; min-width: 0; }
.conn span:last-child { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.dot { width: 9px; height: 9px; border-radius: 50%; background: var(--muted); flex: none; }
.dot.ok { background: var(--ok); } .dot.wait { background: var(--warn); animation: pulse 1s infinite alternate; } .dot.bad { background: var(--bad); }
@keyframes pulse { to { opacity: .35; } }
.icon-btn { border: 1px solid var(--line); background: var(--card); border-radius: 10px; width: 38px; height: 38px; display: grid; place-items: center; cursor: pointer; flex: none; }
.icon-btn:hover { background: var(--soft); }
.grid { display: grid; gap: 12px; grid-template-columns: repeat(12, 1fr); }
.card { background: var(--card); border: 1px solid var(--line); border-radius: 14px; padding: 16px; box-shadow: var(--shadow); min-width: 0; }
.lbl { color: var(--muted); font-size: 13px; }
.hero { grid-column: span 7; display: flex; flex-direction: column; gap: 10px; }
.next { grid-column: span 5; display: flex; flex-direction: column; gap: 6px; }
.tile { grid-column: span 3; }
.chart { grid-column: span 12; }
.log { grid-column: span 7; }
.info { grid-column: span 5; }
@media (max-width: 860px) { .hero, .next, .log, .info { grid-column: span 12; } .tile { grid-column: span 6; } }
.phase-row { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
.phase-dot { width: 16px; height: 16px; border-radius: 50%; background: #c9c9c9; flex: none; box-shadow: inset 0 0 0 1px rgba(0,0,0,.12); }
.phase { font-size: 32px; font-weight: 650; letter-spacing: -.02em; line-height: 1.1; }
.cycle { color: var(--muted); font-size: 17px; }
.chip { font-size: 12px; border: 1px solid var(--line); border-radius: 999px; padding: 2px 8px; color: var(--muted); font-variant-numeric: tabular-nums; }
.bar { height: 8px; background: var(--soft); border-radius: 99px; overflow: hidden; }
.bar > div { height: 100%; width: 0; background: var(--accent); border-radius: 99px; transition: width .6s; }
.sub { color: var(--muted); font-size: 14px; font-variant-numeric: tabular-nums; }
.big { font-size: 30px; font-weight: 650; letter-spacing: -.02em; font-variant-numeric: tabular-nums; line-height: 1.15; }
.val { font-size: 24px; font-weight: 650; font-variant-numeric: tabular-nums; margin-top: 2px; }
.val small { font-size: 15px; font-weight: 500; color: var(--muted); margin-left: 3px; }
.tile .sub { margin-top: 2px; }
.warn-tile .val { color: var(--warn); }
.banner { grid-column: span 12; border-radius: 12px; padding: 10px 14px; background: color-mix(in srgb, var(--warn) 14%, var(--card)); border: 1px solid color-mix(in srgb, var(--warn) 45%, var(--line)); display: none; }
.banner.show { display: block; }
.banner b { display: block; margin-bottom: 2px; }
.banner ul { margin: 0; padding-left: 18px; }
.chart-head { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; margin-bottom: 6px; }
.chart-head h2, .log h2, .info h2 { font-size: 16px; margin: 0; font-weight: 650; }
.chart-head .lbl { font-size: 12px; }
.seg { margin-left: auto; display: inline-flex; border: 1px solid var(--line); border-radius: 10px; overflow: hidden; }
.seg button { border: 0; background: transparent; padding: 6px 12px; cursor: pointer; color: var(--muted); }
.seg button.on { background: var(--soft); color: var(--fg); font-weight: 600; }
.chart-sum { color: var(--muted); font-size: 13px; font-variant-numeric: tabular-nums; min-height: 19px; }
#plot { width: 100%; height: 260px; display: block; touch-action: pan-y; }
#plot text { fill: var(--muted); font-size: 11px; font-variant-numeric: tabular-nums; }
#plot .grid-l { stroke: var(--line); stroke-width: 1; }
#plot .avg { fill: none; stroke: var(--power); stroke-width: 1.6; stroke-linejoin: round; }
#plot .now { fill: var(--power); }
#plot .cross { stroke: var(--muted); stroke-dasharray: 3 3; }
.tip { position: absolute; pointer-events: none; background: var(--card); border: 1px solid var(--line); border-radius: 8px; padding: 5px 8px; font-size: 12px; box-shadow: var(--shadow); white-space: nowrap; display: none; font-variant-numeric: tabular-nums; }
.plot-wrap { position: relative; }
.empty { color: var(--muted); font-size: 14px; padding: 30px 0; text-align: center; }
.log ol { list-style: none; margin: 8px 0 0; padding: 0; max-height: 320px; overflow: auto; }
.log li { display: flex; gap: 10px; padding: 6px 0; border-top: 1px solid var(--line); font-size: 14px; }
.log li:first-child { border-top: 0; }
.log time { color: var(--muted); font-variant-numeric: tabular-nums; flex: none; min-width: 74px; }
.log .k { width: 8px; height: 8px; border-radius: 50%; margin-top: 7px; flex: none; }
.info dl { display: grid; grid-template-columns: auto 1fr; gap: 4px 14px; margin: 8px 0 0; font-size: 14px; }
.info dt { color: var(--muted); }
.info dd { margin: 0; font-variant-numeric: tabular-nums; overflow-wrap: anywhere; }
dialog { border: 1px solid var(--line); border-radius: 16px; padding: 0; background: var(--card); color: var(--fg); width: min(440px, calc(100vw - 32px)); box-shadow: 0 10px 40px rgba(0,0,0,.25); }
dialog::backdrop { background: rgba(0,0,0,.35); }
dialog form { padding: 18px; display: grid; gap: 12px; }
dialog h2 { margin: 0; font-size: 18px; }
dialog label { display: grid; gap: 4px; font-size: 14px; }
dialog input, dialog select { border: 1px solid var(--line); background: var(--bg); border-radius: 10px; padding: 9px 10px; width: 100%; }
dialog .hint { color: var(--muted); font-size: 13px; margin: 0; }
dialog .err { color: var(--bad); font-size: 13px; margin: 0; min-height: 0; }
dialog .row { display: flex; gap: 8px; justify-content: flex-end; }
.btn { border: 1px solid var(--line); background: var(--soft); border-radius: 10px; padding: 8px 14px; cursor: pointer; }
.btn.primary { background: var(--accent); border-color: var(--accent); color: #fff; font-weight: 600; }
.check { display: flex !important; grid-template-columns: none; align-items: center; gap: 8px !important; }
.check input { width: auto; }
.stale { opacity: .55; transition: opacity .3s; }
footer { color: var(--muted); font-size: 12px; text-align: center; padding: 18px 0 6px; }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1 id="title">Uponor Clean I</h1>
    <div class="conn" id="conn"><span class="dot" id="cdot"></span><span id="ctext"></span></div>
    <button class="icon-btn" id="setb" type="button" aria-label="Asetukset">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg>
    </button>
  </header>

  <main class="grid" id="main">
    <div class="banner" id="banner"><b id="banner-t"></b><ul id="banner-l"></ul></div>

    <section class="card hero" id="hero">
      <div class="lbl" id="l-now"></div>
      <div class="phase-row"><span class="phase-dot" id="pdot"></span><span class="phase" id="phase">–</span><span class="cycle" id="cycle"></span><span class="chip" id="code" hidden></span></div>
      <div class="bar" id="pbar-w"><div id="pbar"></div></div>
      <div class="sub" id="psub">&nbsp;</div>
    </section>

    <section class="card next" id="next">
      <div class="lbl" id="n-lbl"></div>
      <div class="big" id="n-big">–</div>
      <div class="sub" id="n-sub">&nbsp;</div>
      <div class="sub" id="n-last"></div>
    </section>

    <section class="card tile" id="t-power"><div class="lbl" id="tl-power"></div><div class="val" id="tv-power">–</div><div class="sub" id="ts-power">&nbsp;</div></section>
    <section class="card tile" id="t-batch"><div class="lbl" id="tl-batch"></div><div class="val" id="tv-batch">–</div><div class="sub" id="ts-batch">&nbsp;</div></section>
    <section class="card tile" id="t-chem"><div class="lbl" id="tl-chem"></div><div class="val" id="tv-chem">–</div><div class="sub" id="ts-chem">&nbsp;</div></section>
    <section class="card tile" id="t-sludge"><div class="lbl" id="tl-sludge"></div><div class="val" id="tv-sludge">–</div><div class="sub" id="ts-sludge">&nbsp;</div></section>

    <section class="card chart">
      <div class="chart-head">
        <h2 id="c-title"></h2><span class="lbl" id="c-note"></span>
        <div class="seg" id="ranges" role="group">
          <button type="button" data-h="6">6 h</button><button type="button" data-h="24">24 h</button><button type="button" data-h="168" id="r7"></button>
        </div>
      </div>
      <div class="chart-sum" id="csum"></div>
      <div class="plot-wrap"><svg id="plot" role="img"></svg><div class="tip" id="tip"></div></div>
    </section>

    <section class="card log">
      <h2 id="g-title"></h2>
      <ol id="glist"></ol>
      <div class="empty" id="gempty"></div>
    </section>

    <section class="card info">
      <h2 id="i-title"></h2>
      <dl id="idl"></dl>
    </section>
  </main>
  <footer id="foot"></footer>
</div>

<dialog id="dlg">
  <form method="dialog" id="dform">
    <h2 id="d-title"></h2>
    <p class="hint" id="d-hint"></p>
    <label><span id="d-host-l"></span><input id="d-host" inputmode="url" autocomplete="off" spellcheck="false" placeholder="192.168.0.102"></label>
    <label id="d-pw-w"><span id="d-pw-l"></span><input id="d-pw" type="password" autocomplete="current-password"></label>
    <label class="check" id="d-rem-w"><input type="checkbox" id="d-rem"><span id="d-rem-l"></span></label>
    <label><span id="d-lang-l"></span><select id="d-lang"><option value="auto"></option><option value="fi">Suomi</option><option value="en">English</option></select></label>
    <p class="err" id="d-err"></p>
    <div class="row"><button class="btn" type="button" id="d-cancel"></button><button class="btn primary" type="submit" id="d-ok"></button></div>
  </form>
</dialog>

// ------------------------------------------------------------------ SHA-256 (the page may not be a secure context, so no crypto.subtle)
const sha256 = (() => {
  const K = [], H = []; let n = 2, c = 0;

        const t2 = ((rotr(A, 2) ^ rotr(A, 13) ^ rotr(A, 22)) + ((A & B) ^ (A & C) ^ (B & C))) | 0;

})();

// ------------------------------------------------------------------ Shelly RPC over WebSocket (digest auth when the Shelly has a password)
const SRC = 'uc-app-' + Math.random().toString(36).slice(2, 8);
const rpc = {
  ws: null, id: 0, pend: new Map(), host: null, auth: null, nc: 0, password: null, ha1: null, onNotify: null, onClose: null,
  open(host) {
    return new Promise((ok, fail) => {
      this.host = host; this.auth = null;
      let ws; try { ws = new WebSocket('ws://' + host + '/rpc'); } catch (e) { fail(e); return; }
      this.ws = ws;
      const t = setTimeout(() => { try { ws.close(); } catch (e) { /* closed */ } fail(new Error('timeout')); }, 8000);

  close() { const ws = this.ws; this.ws = null; if (ws) try { ws.close(); } catch (e) { /* closed */ } },
  authObj() {

      return this.call(method, params, true);
    }

  },
};

    (r.keys || []).forEach((k, i) => { KI[k] = i; });
    for (const blk of r.data || []) {

        const ts = blk.ts + i * blk.period;
        S.recs.set(ts, { e: v[KI.total_act_energy], mx: v[KI.max_act_power], mn: v[KI.min_act_power], u: v[KI.avg_voltage], p: blk.period });
        if (S.lastTs === null || ts > S.lastTs) S.lastTs = ts;

// first the range on screen, then the rest of the 7 days; later only the new minutes
async function loadHistory(full) {
  if (!S.connected || S.histBusy) return;

    const now = Math.floor(Date.now() / 1000);
    if (full || S.lastTs === null) {
      S.recs.clear(); S.lastTs = null; renderChart();
      const split = now - Math.min(S.hours, 24) * 3600;
      await fetchRange(split, now, renderChart);
      renderChart();
      await fetchRange(now - 7 * 86400, split - 1, S.hours > 24 ? renderChart : null);
    } else await fetchRange(S.lastTs + 60, now);
    const cut = now - 7 * 86400 - 3600;
    for (const ts of S.recs.keys()) if (ts < cut) S.recs.delete(ts);
    S.histErr = null;
  } catch (e) { S.histErr = String(e.message || e); }
  S.histBusy = false;
  renderChart();
}

// When the power changed during the minute: the energy average, kept between the minimum and maximum.
const minuteW = (r) => (r.mx - r.mn < 6 ? (r.mn + r.mx) / 2 : Math.min(r.mx, Math.max(r.mn, r.e * 3600 / r.p)));

let chartPts = null;
function renderChart() {

  svg.setAttribute('viewBox', `0 0 ${W} ${H}`);
  const now = Date.now() / 1000, span = S.hours * 3600, t0 = now - span;
  const padL = 34, padR = 10, padT = 18, padB = 24, pw = W - padL - padR, ph = H - padT - padB;

    const b = map.get(k) || { k, n: 0, w: 0, pn: 0, u: 0, t: k * bs + bs / 2 };

  const tz = new Date().getTimezoneOffset() * 60;
  for (let t = Math.ceil((t0 - tz) / tick) * tick + tz; t <= now; t += tick) {
    const lab = tick >= 86400 ? new Date(t * 1000).toLocaleDateString(loc(), { weekday: 'short', day: 'numeric', month: 'numeric' }) : hm(t);
    o += `<line class="grid-l" x1="${x(t).toFixed(1)}" x2="${x(t).toFixed(1)}" y1="${padT}" y2="${padT + ph}" stroke-opacity=".5"/>`;
    o += `<text x="${x(t).toFixed(1)}" y="${H - 6}" text-anchor="middle">${lab}</text>`;
  }
  // the line, broken where minutes are missing
  let seg = [];
  const flush = () => {
    if (seg.length === 1) o += `<circle class="now" cx="${x(seg[0].t).toFixed(1)}" cy="${y(seg[0].pn).toFixed(1)}" r="1.2"/>`;
    else if (seg.length) o += `<polyline class="avg" points="${seg.map((b) => `${x(b.t).toFixed(1)},${y(b.pn).toFixed(1)}`).join(' ')}"/>`;
    seg = [];
  };
  for (let i = 0; i < B.length; i++) { if (i && B[i].k - B[i - 1].k > 1) flush(); seg.push(B[i]); }
  flush();
  // live power at the right edge
  if (S.connected && S.power !== null && now - S.powerAt < 30) o += `<circle class="now" cx="${x(now).toFixed(1)}" cy="${y(Math.min(normW(S.power, S.voltage), ymax)).toFixed(1)}" r="3.5"/>`;
  o += `<line class="cross" id="cross" x1="0" x2="0" y1="${padT}" y2="${padT + ph}" visibility="hidden"/>`;
  if (!B.length) o += `<text x="${(padL + pw / 2).toFixed(0)}" y="${(padT + ph / 2).toFixed(0)}" text-anchor="middle" style="font-size:13px">${esc(S.connected && (S.histBusy || S.lastTs === null) ? T.loading : S.histErr ? S.histErr : T.no_hist)}</text>`;
  svg.innerHTML = o;
  chartPts = { B, x, t0, span, padL, pw, W, bs };
  $('csum').textContent = sSum > 0 ? fmt(T.sum, { w: num(eSum * 3600 / sSum, 1), e: num(eSum / 1000, 2), d: S.hours > 24 ? fmt(T.per_day, { e: num(eSum / 1000 / (sSum / 86400), 2) }) : '' }) : ' ';
  for (const b of $('ranges').children) b.classList.toggle('on', Number(b.dataset.h) === S.hours);
}

function hover(ev) {
  const P = chartPts, tip = $('tip'), cross = document.getElementById('cross');
  if (!P || !cross || !P.B.length) return;
  const r = $('plot').getBoundingClientRect();
  const px = (ev.clientX - r.left) * (P.W / r.width);
  const t = P.t0 + (px - P.padL) / P.pw * P.span;
  let lo = 0, hi = P.B.length - 1;
  while (lo < hi) { const mid = (lo + hi) >> 1; if (P.B[mid].t < t) lo = mid + 1; else hi = mid; }
  if (lo > 0 && Math.abs(P.B[lo - 1].t - t) < Math.abs(P.B[lo].t - t)) lo--;
  const b = P.B[lo];
  if (px < P.padL || Math.abs(b.t - t) > P.bs * 3) { tip.style.display = 'none'; cross.setAttribute('visibility', 'hidden'); return; }
  cross.setAttribute('x1', P.x(b.t)); cross.setAttribute('x2', P.x(b.t)); cross.setAttribute('visibility', 'visible');
  const lab = S.hours > 24 ? new Date(b.t * 1000).toLocaleDateString(loc(), { weekday: 'short', day: 'numeric', month: 'numeric' }) + ' ' + hm(b.t) : hm(b.t);
  tip.textContent = fmt(T.tip, { t: lab, w: num(b.pn, 1), r: num(b.w, 1), u: num(b.u, 0) });
  tip.style.display = 'block';
  const wx = (P.x(b.t) / P.W) * r.width;
  tip.style.left = Math.min(Math.max(0, wx - tip.offsetWidth / 2), r.width - tip.offsetWidth) + 'px';
  tip.style.top = '4px';
}

// ------------------------------------------------------------------ connection
let retry = 0, retryT = null, pollT = null, histT = null, gen = 0;
async function connect() {
  clearTimeout(retryT); clearInterval(pollT); clearInterval(histT);
  rpc.close(); S.connected = false; S.err = null;
  const my = ++gen;
  if (!S.host) { setConn('', T.conn_none); openSettings(); return; }
  if (location.protocol === 'https:') { setConn('bad', T.conn_bad); S.err = T.e_https; openSettings(); return; }
  setConn('wait', T.conn_wait);
  rpc.password = sessionPassword; rpc.ha1 = rpc.ha1 || store.get('ha1:' + S.host) || null;
  try {
    await rpc.open(S.host);
    if (my !== gen) return;
    S.info = await rpc.call('Shelly.GetDeviceInfo');
    if (S.info && S.info.id && rpc.ha1 === null && sessionPassword) rpc.ha1 = sha256('admin:' + S.info.id + ':' + sessionPassword);
    const list = await rpc.call('Script.List');
    const sc = (list.scripts || []).filter((s) => /^uponor[-_ ]?clean(?![-_ ]?app)/i.test(s.name || '')).sort((a, b) => b.running - a.running)[0];
    if (!sc || !sc.running) { S.scriptId = sc ? sc.id : null; setConn('bad', T.conn_noscript); S.err = T.e_noscript; renderInfo(); return; }
    S.scriptId = sc.id;
    if (rpc.ha1 && document.getElementById('d-rem').checked) store.set('ha1:' + S.host, rpc.ha1);
    S.connected = true; retry = 0;
    setConn('ok', T.conn_ok);
    addLog({ type: '_conn', ts: Date.now() / 1000 });
    await poll();
    pollT = setInterval(poll, 3000);
    loadHistory(true);
    histT = setInterval(() => loadHistory(false), 60000);
  } catch (e) {
    if (my !== gen) return;
    rpc.close();
    if (e.code === 401) {
      setConn('bad', T.conn_auth); S.err = rpc.ha1 ? T.e_badpw : T.e_auth;
      rpc.ha1 = null; store.set('ha1:' + S.host, null); openSettings(true); return;
    }
    setConn('bad', T.conn_bad);
    scheduleRetry();
  }
}
function scheduleRetry() {
  clearTimeout(retryT);
  retry = Math.min(retry + 1, 6);
  retryT = setTimeout(connect, [0, 2, 4, 8, 15, 30, 30][retry] * 1000);
}
rpc.onClose = () => {
  if (!S.connected) return;
  S.connected = false; clearInterval(pollT); clearInterval(histT);
  addLog({ type: '_lost', ts: Date.now() / 1000 });
  setConn('bad', T.conn_bad); render(); renderChart();
  scheduleRetry();
};
rpc.onNotify = (m) => {
  if (m.method === 'NotifyEvent') {
    for (const e of (m.params && m.params.events) || []) {
      if (e.event !== 'uponor' || !e.data) continue;
      const d = Object.assign({}, e.data); d.ts = d.ts || e.ts || m.params.ts || Date.now() / 1000;
      addLog(d);
      stateDue = true; clearTimeout(rpc.evT); rpc.evT = setTimeout(poll, 300);
    }
  } else if (m.method === 'NotifyStatus' && m.params && m.params['em1:0'] && typeof m.params['em1:0'].act_power === 'number') {
    S.power = m.params['em1:0'].act_power; S.powerAt = Date.now() / 1000;
    if (typeof m.params['em1:0'].voltage === 'number') S.voltage = m.params['em1:0'].voltage;
    render();
  }
};

// every 3 s: the power (unless the Shelly sent it), every 6 s or after an event: the script state
let pollBusy = false, pollN = 0, stateDue = true, pollFails = 0;
async function poll() {
  if (!S.connected || pollBusy) return;
  pollBusy = true;
  try {
    if (stateDue || pollN % 2 === 0) {
      stateDue = false;
      const r = await rpc.call('Script.Eval', { id: S.scriptId, code: 'JSON.stringify(stateObject())' });
      const s = typeof r.result === 'string' ? JSON.parse(r.result) : r.result;
      if (s && typeof s === 'object') { S.state = s; S.stateAt = Date.now(); S.err = null; pollFails = 0; }
    }
    pollN++;
    if (Date.now() / 1000 - S.powerAt > 2.5) {
      const em = await rpc.call('EM1.GetStatus', { id: 0 });
      if (em && typeof em.act_power === 'number') { S.power = em.act_power; S.voltage = em.voltage; S.powerAt = Date.now() / 1000; }
    }
  } catch (e) {
    if (S.connected) {
      S.err = fmt(T.e_eval, { m: e.message || e });
      // a connection that died without closing (e.g. a phone asleep): connect again
      if (++pollFails >= 3) {
        pollFails = 0; S.connected = false; clearInterval(pollT); clearInterval(histT); rpc.close();
        addLog({ type: '_lost', ts: Date.now() / 1000 }); setConn('bad', T.conn_bad); scheduleRetry();
      }
    }
  }
  pollBusy = false;
  render();
  if (pollN % 5 === 0) renderChart();
}

// ------------------------------------------------------------------ settings dialog
let sessionPassword = null;
function openSettings(focusPw) {
  const d = $('dlg');
  $('d-host').value = S.host || '';
  $('d-pw').value = '';
  $('d-lang').value = lang;
  $('d-err').textContent = S.err || '';
  $('d-rem').checked = !!store.get('ha1:' + S.host) || $('d-rem').checked;
  if (!d.open) { try { d.showModal(); } catch (e) { d.setAttribute('open', ''); } }
  (focusPw ? $('d-pw') : $('d-host')).focus();
}
$('setb').addEventListener('click', () => openSettings(false));
$('d-cancel').addEventListener('click', () => $('dlg').close());
$('dform').addEventListener('submit', (ev) => {
  ev.preventDefault();
  const h = $('d-host').value.trim().replace(/^(https?|wss?):\/\//, '').replace(/\/.*$/, '');
  const changed = h !== S.host;
  S.host = h; store.set('host', h || null);
  if ($('d-pw').value) { sessionPassword = $('d-pw').value; rpc.ha1 = null; }
  if (!$('d-rem').checked) store.set('ha1:' + h, null);
  lang = $('d-lang').value; store.set('lang', lang === 'auto' ? null : lang);
  setTexts(); renderLog(); render(); renderChart();
  $('dlg').close();
  if (changed) { S.state = null; S.recs.clear(); S.lastTs = null; S.log = []; renderLog(); }
  connect();
});

// ------------------------------------------------------------------ start
$('ranges').addEventListener('click', (ev) => { const b = ev.target.closest('button'); if (!b) return; S.hours = Number(b.dataset.h); store.set('hours', String(S.hours)); renderChart(); });
$('plot').addEventListener('pointermove', hover);
$('plot').addEventListener('pointerleave', () => { $('tip').style.display = 'none'; const c = document.getElementById('cross'); if (c) c.setAttribute('visibility', 'hidden'); });
let rzT = null; window.addEventListener('resize', () => { clearTimeout(rzT); rzT = setTimeout(renderChart, 150); });
document.addEventListener('visibilitychange', () => { if (!document.hidden && !S.connected && S.host) { retry = 0; connect(); } });
setInterval(() => { if (S.state) render(); }, 15000);
setTexts(); renderLog(); renderInfo(); renderChart();
if (urlHost) store.set('host', urlHost);
connect();
window.__ucApp = { S, sha256, rpc };   // for tests
})();
</script>
