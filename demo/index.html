<!doctype html>
<html lang="fi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Uponor Clean – demo</title>
<meta name="description" content="Uponor Clean I -puhdistamon livetiedot ja tehohistoria suoraan Shellystä">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect x='3' y='9' width='26' height='18' rx='6' fill='%232D8CE0'/%3E%3Crect x='3' y='9' width='26' height='7' rx='3' fill='%23d7e8f8'/%3E%3C/svg%3E">
<!-- Uponor Clean I browser app (github.com/fraatti/uponor-clean-shelly). Reads the Shelly script v3
     over the Shelly WebSocket RPC in the home network: the state with Script.Eval, the live power,
     the script's "uponor" events and the power history stored on the Shelly (EM1Data). -->
<style>
:root {
  --bg: #f2f3f5; --card: #ffffff; --fg: #1d2127; --muted: #69707a; --line: #e3e5e9; --soft: #f6f7f9;
  --accent: #2D8CE0; --power: #d64541; --ok: #2e9b55; --warn: #d9822b; --bad: #d64541;
  --shadow: 0 1px 2px rgba(0,0,0,.05), 0 2px 8px rgba(0,0,0,.04);
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #111317; --card: #1b1e24; --fg: #e7e9ec; --muted: #9aa1ab; --line: #2c3038; --soft: #22262d;
    --accent: #4aa3ee; --power: #f0625d; --shadow: none; color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #111317; --card: #1b1e24; --fg: #e7e9ec; --muted: #9aa1ab; --line: #2c3038; --soft: #22262d;
  --accent: #4aa3ee; --power: #f0625d; --shadow: none; color-scheme: dark;
}
/* the Home Assistant theme variables the card reads */
:root { --primary-text-color: var(--fg); --secondary-text-color: var(--muted); --card-background-color: var(--card); --divider-color: var(--line); --primary-color: var(--accent); }
* { box-sizing: border-box; }
html, body { margin: 0; }
body { background: var(--bg); color: var(--fg); font: 15px/1.45 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; -webkit-text-size-adjust: 100%; }
button, input, select { font: inherit; color: inherit; }
.wrap { max-width: 1120px; margin: 0 auto; padding: 16px; }
header { display: flex; align-items: center; gap: 12px; margin-bottom: 14px; }
header h1 { font-size: 20px; margin: 0; font-weight: 650; letter-spacing: -.01em; }
@media (max-width: 520px) { header h1 { font-size: 18px; white-space: nowrap; } .conn .host { display: none; } }
.conn { margin-left: auto; display: flex; align-items: center; gap: 8px; color: var(--muted); font-size: 13px; min-width: 0; }
.conn span:last-child { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.dot { width: 9px; height: 9px; border-radius: 50%; background: var(--muted); flex: none; }
.dot.ok { background: var(--ok); } .dot.wait { background: var(--warn); animation: pulse 1s infinite alternate; } .dot.bad { background: var(--bad); }
@keyframes pulse { to { opacity: .35; } }
.icon-btn { border: 1px solid var(--line); background: var(--card); border-radius: 10px; width: 38px; height: 38px; display: grid; place-items: center; cursor: pointer; flex: none; }
.icon-btn:hover { background: var(--soft); }
.grid { display: grid; gap: 12px; grid-template-columns: repeat(12, 1fr); }
.card { background: var(--card); border: 1px solid var(--line); border-radius: 14px; padding: 16px; box-shadow: var(--shadow); min-width: 0; }
.lbl { color: var(--muted); font-size: 13px; }
.hero { grid-column: span 7; display: flex; flex-direction: column; gap: 10px; }
.next { grid-column: span 5; display: flex; flex-direction: column; gap: 6px; }
.tile { grid-column: span 3; }
.chart { grid-column: span 12; }
.log { grid-column: span 7; }
.info { grid-column: span 5; }
@media (max-width: 860px) { .hero, .next, .log, .info { grid-column: span 12; } .tile { grid-column: span 6; } }
.phase-row { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
.phase-dot { width: 16px; height: 16px; border-radius: 50%; background: #c9c9c9; flex: none; box-shadow: inset 0 0 0 1px rgba(0,0,0,.12); }
.phase { font-size: 32px; font-weight: 650; letter-spacing: -.02em; line-height: 1.1; }
.cycle { color: var(--muted); font-size: 17px; }
.chip { font-size: 12px; border: 1px solid var(--line); border-radius: 999px; padding: 2px 8px; color: var(--muted); font-variant-numeric: tabular-nums; }
.bar { height: 8px; background: var(--soft); border-radius: 99px; overflow: hidden; }
.bar > div { height: 100%; width: 0; background: var(--accent); border-radius: 99px; transition: width .6s; }
.sub { color: var(--muted); font-size: 14px; font-variant-numeric: tabular-nums; }
.big { font-size: 30px; font-weight: 650; letter-spacing: -.02em; font-variant-numeric: tabular-nums; line-height: 1.15; }
.val { font-size: 24px; font-weight: 650; font-variant-numeric: tabular-nums; margin-top: 2px; }
.val small { font-size: 15px; font-weight: 500; color: var(--muted); margin-left: 3px; }
.tile .sub { margin-top: 2px; }
.warn-tile .val { color: var(--warn); }
.banner { grid-column: span 12; border-radius: 12px; padding: 10px 14px; background: color-mix(in srgb, var(--warn) 14%, var(--card)); border: 1px solid color-mix(in srgb, var(--warn) 45%, var(--line)); display: none; }
.banner.show { display: block; }
.banner b { display: block; margin-bottom: 2px; }
.banner ul { margin: 0; padding-left: 18px; }
.chart-head { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; margin-bottom: 6px; }
.chart-head h2, .log h2, .info h2 { font-size: 16px; margin: 0; font-weight: 650; }
.chart-head .lbl { font-size: 12px; }
.seg { margin-left: auto; display: inline-flex; border: 1px solid var(--line); border-radius: 10px; overflow: hidden; }
.seg button { border: 0; background: transparent; padding: 6px 12px; cursor: pointer; color: var(--muted); }
.seg button.on { background: var(--soft); color: var(--fg); font-weight: 600; }
.chart-sum { color: var(--muted); font-size: 13px; font-variant-numeric: tabular-nums; min-height: 19px; }
#plot { width: 100%; height: 260px; display: block; touch-action: pan-y; }
#plot text { fill: var(--muted); font-size: 11px; font-variant-numeric: tabular-nums; }
#plot .grid-l { stroke: var(--line); stroke-width: 1; }
#plot .avg { fill: none; stroke: var(--power); stroke-width: 1.6; stroke-linejoin: round; }
#plot .now { fill: var(--power); }
#plot .cross { stroke: var(--muted); stroke-dasharray: 3 3; }
.tip { position: absolute; pointer-events: none; background: var(--card); border: 1px solid var(--line); border-radius: 8px; padding: 5px 8px; font-size: 12px; box-shadow: var(--shadow); white-space: nowrap; display: none; font-variant-numeric: tabular-nums; }
.plot-wrap { position: relative; }
.empty { color: var(--muted); font-size: 14px; padding: 30px 0; text-align: center; }
.log ol { list-style: none; margin: 8px 0 0; padding: 0; max-height: 320px; overflow: auto; }
.log li { display: flex; gap: 10px; padding: 6px 0; border-top: 1px solid var(--line); font-size: 14px; }
.log li:first-child { border-top: 0; }
.log time { color: var(--muted); font-variant-numeric: tabular-nums; flex: none; min-width: 74px; }
.log .k { width: 8px; height: 8px; border-radius: 50%; margin-top: 7px; flex: none; }
.info dl { display: grid; grid-template-columns: auto 1fr; gap: 4px 14px; margin: 8px 0 0; font-size: 14px; }
.info dt { color: var(--muted); }
.info dd { margin: 0; font-variant-numeric: tabular-nums; overflow-wrap: anywhere; }
dialog { border: 1px solid var(--line); border-radius: 16px; padding: 0; background: var(--card); color: var(--fg); width: min(440px, calc(100vw - 32px)); box-shadow: 0 10px 40px rgba(0,0,0,.25); }
dialog::backdrop { background: rgba(0,0,0,.35); }
dialog form { padding: 18px; display: grid; gap: 12px; }
dialog h2 { margin: 0; font-size: 18px; }
dialog label { display: grid; gap: 4px; font-size: 14px; }
dialog input, dialog select { border: 1px solid var(--line); background: var(--bg); border-radius: 10px; padding: 9px 10px; width: 100%; }
dialog .hint { color: var(--muted); font-size: 13px; margin: 0; }
dialog .err { color: var(--bad); font-size: 13px; margin: 0; min-height: 0; }
dialog .row { display: flex; gap: 8px; justify-content: flex-end; }
.btn { border: 1px solid var(--line); background: var(--soft); border-radius: 10px; padding: 8px 14px; cursor: pointer; }
.btn.primary { background: var(--accent); border-color: var(--accent); color: #fff; font-weight: 600; }
.check { display: flex !important; grid-template-columns: none; align-items: center; gap: 8px !important; }
.check input { width: auto; }
dialog fieldset { border: 1px solid var(--line); border-radius: 12px; padding: 8px 12px 12px; margin: 0; display: grid; gap: 8px; min-width: 0; }
dialog legend { font-size: 14px; padding: 0 4px; }
dialog .inst-s { font-size: 13px; margin: 0; overflow-wrap: anywhere; }
dialog .inst-s a { color: var(--accent); }
.btn:disabled { opacity: .55; cursor: default; }
.stale { opacity: .55; transition: opacity .3s; }
header .views { margin-left: 4px; }
#pic { display: none; }
body.pic #pic { display: block; }
body.pic #main { display: none; }
body.pic .wrap { max-width: 1640px; }   /* the picture fits the window: drawing and timeline left, status and logbook right */
uponor-clean-card { --uc-fit-bottom: 62px; }   /* the footer under the card */
@media (max-width: 520px) { header .views button { padding: 6px 9px; } .conn #ctext { display: none; } }
footer { color: var(--muted); font-size: 12px; text-align: center; padding: 18px 0 6px; }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1 id="title">Uponor Clean I</h1>
    <div class="seg views" id="views"><button type="button" data-v="pic" id="v-pic"></button><button type="button" data-v="data" id="v-data"></button></div>
    <div class="conn" id="conn"><span class="dot" id="cdot"></span><span id="ctext"></span></div>
    <button class="icon-btn" id="setb" type="button" aria-label="Asetukset">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg>

  <section id="pic"></section>

    <section class="card tile" id="t-batch"><div class="lbl" id="tl-batch"></div><div class="val" id="tv-batch">–</div><div class="sub" id="ts-batch">&nbsp;</div></section>

<script id="uc-demo-data" src="data.js"></script>
<script id="uc-demo">
// Demo Shelly for the online demo of the browser app (demo/index.html, built by app/tools/build_demo.js).
// Answers the app's WebSocket RPC for the host "demo" from a recording of a real plant (window.UC_DEMO,
// demo/data.js): the power and voltage, the power history (EM1Data) and the v3 script's state and events.
// The recording is moved by whole days so that it runs in real time with the clock of today; with at
// least a day of it still ahead and a week behind. Entering the chemical and the sludge counter works
// in the page only. build_demo.js lets the host "demo" through the app's https check.
(() => {
  'use strict';
  const D = window.UC_DEMO;
  for (const id of ['uc-demo-data', 'uc-demo']) { const e = document.getElementById(id); if (e) e.remove(); }
  if (!D) return;
  const HOST = 'demo', DEV_ID = 'shellyemminig4-demo', SID = 1, DAY = 864e5;
  window.__ucDemoHost = HOST;
  // the app reads the host from the address
  const q = new URLSearchParams(location.search);
  if (!q.get('host')) { q.set('host', HOST); history.replaceState(null, '', location.pathname + '?' + q + location.hash); }

  // ---------------------------------------------------------------- the recording
  const T0 = D.t0 * 1000, T1 = D.t1 * 1000;
  const pt = [], pv = [];
  { let t = D.t0; for (let i = 0; i < D.p.length; i += 2) { t += D.p[i]; pt.push(t * 1000); pv.push(D.p[i + 1] / 10); } }
  const cum = new Float64Array(pt.length);
  for (let i = 1; i < pt.length; i++) cum[i] = cum[i - 1] + pv[i - 1] * (pt[i] - pt[i - 1]) / 3600e3;
  const sts = [];
  { let t = D.t0, cur = {}; for (let i = 0; i < D.st.length; i += 2) { t += D.st[i]; cur = Object.assign({}, cur, D.st[i + 1]); sts.push([t * 1000, cur]); } }
  const evs = [];
  { let t = D.t0; for (let i = 0; i < D.ev.length; i += 2) { t += D.ev[i]; evs.push([t * 1000, D.ev[i + 1]]); } }
  // last index with a[i] <= t (-1 before the first)
  const at = (a, t, key) => { let lo = 0, hi = a.length - 1, r = -1; while (lo <= hi) { const m = (lo + hi) >> 1; if ((key ? a[m][0] : a[m]) <= t) { r = m; lo = m + 1; } else hi = m - 1; } return r; };

  // real time = recording time + SHIFT (whole days, so the clock times are the recorded ones)
  const SHIFT = Math.ceil((Date.now() - (T1 - DAY)) / DAY) * DAY;
  const rec = (real) => Math.min((real === undefined ? Date.now() : real) - SHIFT, T1);
  // history the app stored in this browser on another day belongs to another part of the recording
  try {
    if (localStorage.getItem('uc_demo_shift') !== String(SHIFT)) { localStorage.removeItem('uc_app_hist:' + HOST); localStorage.setItem('uc_demo_shift', String(SHIFT)); }
  } catch (e) { /* private window */ }

  const powerAt = (t) => { const i = at(pt, t); return i < 0 ? pv[0] : pv[i]; };
  const energyAt = (t) => { const i = at(pt, t); return i < 0 ? 0 : cum[i] + pv[i] * (t - pt[i]) / 3600e3; };
  const voltAt = (t) => D.u[Math.max(0, Math.min(D.u.length - 1, Math.floor((t - T0) / (D.uStep * 1000))))] / 10;
  const TIMES = ['since', 'eta', 'last_pumpout', 'holiday_at', 'holiday_since', 'ts', 'reset'];
  const shiftTimes = (o) => {
    for (const k of Object.keys(o)) {
      const v = o[k];
      if (v && typeof v === 'object' && !Array.isArray(v)) shiftTimes(v);
      else if (TIMES.includes(k) && typeof v === 'number' && v > 1e9) o[k] = v + SHIFT / 1000;
    }
    return o;
  };

  // entered values: the shown counter is the entered value plus the recorded change since
  const over = {};
  const recState = (t) => { const i = at(sts, t, true); return JSON.parse(JSON.stringify(i < 0 ? { cycle: 'unknown', phase: 'unknown', warnings: [] } : sts[i][1])); };
  function adjust(s) {
    const o = over;
    if (o.chemical && s.chemical && typeof s.chemical.l === 'number') {
      const l = Math.max(0, Math.round((o.chemical.v + s.chemical.l - o.chemical.base) * 100) / 100);
      if (typeof s.chemical.days === 'number' && s.chemical.l > 0) s.chemical.days = Math.round(s.chemical.days * l / s.chemical.l * 10) / 10;
      s.chemical.l = l;
    }
    if (o.sludge && s.sludge && typeof s.sludge.n === 'number') { s.sludge.n = Math.max(0, o.sludge.v + s.sludge.n - o.sludge.base); if (o.sludge.reset) s.sludge.reset = o.sludge.reset; }
    if (o.batches && typeof s.batches === 'number') s.batches = Math.max(0, o.batches.v + s.batches - o.batches.base);
    return s;
  }
  function stateNow() {
    const t = rec(), s = adjust(recState(t));
    s.power = powerAt(t); s.band = null; s.time_synced = true; s.uptime = Math.floor((t - T0) / 1000) + 86400;
    return shiftTimes(s);
  }
  function eventData(d) {
    const e = JSON.parse(JSON.stringify(d));
    if (e.type === 'chemical') { const s = adjust({ chemical: { l: e.l, days: e.days } }); e.l = s.chemical.l; e.days = s.chemical.days; }
    if (e.type === 'sludge') { const s = adjust({ sludge: { n: e.n, reset: e.reset } }); e.n = s.sludge.n; e.reset = s.sludge.reset; }
    if (e.type === 'batch' && typeof e.n === 'number') e.n = adjust({ batches: e.n }).batches;
    return shiftTimes(e);
  }

  // ---------------------------------------------------------------- RPC
  const EQ = 0.2072;   // the minute energy of the device comes in steps of 0.2072 Wh
  const KEYS = ['total_act_energy', 'total_act_ret_energy', 'lag_react_energy', 'lead_react_energy', 'max_act_power', 'min_act_power',
    'max_aprt_power', 'min_aprt_power', 'max_voltage', 'min_voltage', 'avg_voltage', 'max_current', 'min_current', 'avg_current'];
  function record(ts) {
    const a = ts * 1000 - SHIFT, b = a + 60e3;
    const wh = (Math.floor(energyAt(b) / EQ) - Math.floor(energyAt(a) / EQ)) * EQ;
    let i = at(pt, a), p = i < 0 ? pv[0] : pv[i], mn = p, mx = p; i++;
    while (i < pt.length && pt[i] < b) { p = pv[i]; mn = Math.min(mn, p); mx = Math.max(mx, p); i++; }
    const u = voltAt(a), r4 = (x) => Math.round(x * 1e4) / 1e4, r1 = (x) => Math.round(x * 10) / 10;
    return [r4(wh), 0, 0, 0, r1(mx), r1(mn), r1(mx * 1.08), r1(mn * 1.08), r1(u + 0.4), r1(u - 0.3), u, r4(mx / u), r4(mn / u), r4(wh * 60 / u)];
  }
  const firstTs = () => Math.ceil((T0 + SHIFT) / 60e3) * 60;
  const lastTs = () => Math.floor(Math.min(Date.now(), T1 + SHIFT) / 60e3) * 60 - 60;
  const err = (code, message) => { const e = new Error(message); e.code = code; return e; };
  function call(method, p) {
    const t = rec();
    switch (method) {
      case 'Shelly.GetDeviceInfo':

function dur(s) {
  s = Math.max(0, Math.round(s));

  if (m < 60) return m + ' ' + T.min;
  const h = Math.floor(m / 60), mm = m % 60;

// ------------------------------------------------------------------ SHA-256 (the page may not be a secure context, so no crypto.subtle)
const sha256 = (() => {
  const K = [], H = []; let n = 2, c = 0;
  const frac = (x) => ((x - Math.floor(x)) * 4294967296) | 0;
  while (c < 64) {
    let prime = true; for (let d = 2; d * d <= n; d++) if (n % d === 0) { prime = false; break; }
    if (prime) { if (c < 8) H[c] = frac(Math.sqrt(n)); K[c] = frac(Math.cbrt(n)); c++; }
    n++;
  }
  const rotr = (x, k) => (x >>> k) | (x << (32 - k));
  return (str) => {
    const b = new TextEncoder().encode(str), l = b.length;
    const words = new Uint32Array(Math.ceil((l + 9) / 64) * 16);
    for (let i = 0; i < l; i++) words[i >> 2] |= b[i] << (24 - (i & 3) * 8);
    words[l >> 2] |= 0x80 << (24 - (l & 3) * 8);
    words[words.length - 1] = (l * 8) >>> 0; words[words.length - 2] = Math.floor(l / 0x20000000);
    const h = H.slice(), w = new Int32Array(64);
    for (let j = 0; j < words.length; j += 16) {
      for (let i = 0; i < 64; i++) {
        if (i < 16) w[i] = words[j + i];
        else {
          const a = w[i - 15], d = w[i - 2];
          w[i] = (w[i - 16] + (rotr(a, 7) ^ rotr(a, 18) ^ (a >>> 3)) + w[i - 7] + (rotr(d, 17) ^ rotr(d, 19) ^ (d >>> 10))) | 0;
        }
      }
      let [A, B, C, D, E, F, G, X] = h;
      for (let i = 0; i < 64; i++) {
        const t1 = (X + (rotr(E, 6) ^ rotr(E, 11) ^ rotr(E, 25)) + ((E & F) ^ (~E & G)) + K[i] + w[i]) | 0;
        const t2 = ((rotr(A, 2) ^ rotr(A, 13) ^ rotr(A, 22)) + ((A & B) ^ (A & C) ^ (B & C))) | 0;
        X = G; G = F; F = E; E = (D + t1) | 0; D = C; C = B; B = A; A = (t1 + t2) | 0;
      }
      h[0] = (h[0] + A) | 0; h[1] = (h[1] + B) | 0; h[2] = (h[2] + C) | 0; h[3] = (h[3] + D) | 0;
      h[4] = (h[4] + E) | 0; h[5] = (h[5] + F) | 0; h[6] = (h[6] + G) | 0; h[7] = (h[7] + X) | 0;
    }
    return h.map((x) => (x >>> 0).toString(16).padStart(8, '0')).join('');
  };
})();

// ------------------------------------------------------------------ Shelly RPC over WebSocket (digest auth when the Shelly has a password)
const SRC = 'uc-app-' + Math.random().toString(36).slice(2, 8);
const rpc = {
  ws: null, id: 0, pend: new Map(), host: null, auth: null, nc: 0, password: null, ha1: null, onNotify: null, onClose: null,
  open(host) {
    return new Promise((ok, fail) => {
      this.host = host; this.auth = null;
      let ws; try { ws = new WebSocket('ws://' + host + '/rpc'); } catch (e) { fail(e); return; }
      this.ws = ws;
      const t = setTimeout(() => { try { ws.close(); } catch (e) { /* closed */ } fail(new Error('timeout')); }, 8000);
      ws.onopen = () => { clearTimeout(t); ok(); };
      ws.onerror = () => { clearTimeout(t); fail(new Error('ws error')); };
      ws.onclose = () => { clearTimeout(t); for (const p of this.pend.values()) p.fail(new Error('closed')); this.pend.clear(); if (this.ws === ws && this.onClose) this.onClose(); };
      ws.onmessage = (ev) => {
        let m; try { m = JSON.parse(ev.data); } catch (e) { return; }
        if (m.id !== undefined && this.pend.has(m.id)) { const p = this.pend.get(m.id); this.pend.delete(m.id); p.done(m); }
        else if (m.method && this.onNotify) this.onNotify(m);
      };
    });
  },
  close() { const ws = this.ws; this.ws = null; if (ws) try { ws.close(); } catch (e) { /* closed */ } },
  authObj() {
    if (!this.auth || !this.ha1) return undefined;
    this.nc++;
    const nc = this.nc.toString(16).padStart(8, '0'), cnonce = Math.floor(Math.random() * 1e9);
    const ha2 = sha256('dummy_method:dummy_uri');
    return { realm: this.auth.realm, username: 'admin', nonce: this.auth.nonce, cnonce, nc, algorithm: 'SHA-256',
      response: sha256(this.ha1 + ':' + this.auth.nonce + ':' + nc + ':' + cnonce + ':auth:' + ha2) };
  },
  send(method, params, tmo) {
    return new Promise((done, fail) => {
      if (!this.ws || this.ws.readyState !== 1) { fail(new Error('not connected')); return; }
      const id = ++this.id; const msg = { jsonrpc: '2.0', id, src: SRC, method };
      if (params) msg.params = params;
      const a = this.authObj(); if (a) msg.auth = a;
      const t = setTimeout(() => { if (this.pend.has(id)) { this.pend.delete(id); fail(new Error('timeout ' + method)); } }, tmo || 10000);
      this.pend.set(id, { done: (m) => { clearTimeout(t); done(m); }, fail: (e) => { clearTimeout(t); fail(e); } });
      this.ws.send(JSON.stringify(msg));
    });
  },
  async call(method, params, retried, tmo) {
    const m = await this.send(method, params, tmo);
    if (!m.error) return m.result;
    if (m.error.code === 401 && !retried) {
      let ch = {}; try { ch = JSON.parse(m.error.message); } catch (e) { /* not a challenge */ }
      const stale = !!(this.auth && ch.stale);
      this.auth = { realm: ch.realm, nonce: ch.nonce }; this.nc = 0;
      if (!this.ha1 && this.password) this.ha1 = sha256('admin:' + ch.realm + ':' + this.password);
      if (!this.ha1) { const e = new Error('auth'); e.code = 401; throw e; }
      if (stale) this.nc = 0;
      return this.call(method, params, true, tmo);
    }
    const e = new Error(m.error.message || 'rpc error'); e.code = m.error.code; throw e;
  },
};

function render() {
  const st = S.state, now = Date.now() / 1000;
  document.getElementById('main').classList.toggle('stale', !S.connected && !!st);
  document.getElementById('pic').classList.toggle('stale', !S.connected && !!st);
  if (!st) return;
  // phase
  const ph = st.phase || 'unknown', cy = st.cycle || 'unknown';
  $('phase').textContent = T.phase[ph] || ph;
  $('cycle').textContent = T.cycle[cy] || cy;
  $('pdot').style.background = PCOL[ph] || PCOL.unknown;
  const code = $('code'); code.hidden = !st.code; code.textContent = st.code || '';

// ------------------------------------------------------------------ event log
function logText(e) {
  switch (e.type) {
    case 'phase': return fmt(T.ev_phase, { p: T.phase[e.phase] || e.phase, c: T.cycle[e.cycle] || e.cycle });
    case 'batch': return fmt(e.user ? T.ev_batch_user : T.ev_batch, { n: num(e.n) });
    case 'warning': return fmt(e.on ? T.ev_warn_on : T.ev_warn_off, { w: T.warn[e.key] || e.key });
    case 'chemical': return e.user ? fmt(T.ev_chem_user, { l: num(e.l, 1) }) : null;
    case 'sludge': return e.user ? fmt(T.ev_sludge_user, { n: num(e.n) }) : null;
    case 'start': return e.reason === 'power_cut' ? T.ev_start_power_cut : T.ev_start_restart;
    case '_conn': return T.ev_conn;
    case '_lost': return T.ev_lost;

  }
}
function logColor(e) {
  if (e.type === 'phase') return PCOL[e.phase] || PCOL.unknown;
  if (e.type === 'warning') return e.on ? 'var(--warn)' : 'var(--ok)';
  if (e.type === 'batch') return PCOL.pump_out;

}
function addLog(e) {

  renderLog();
}

  const ol = $('glist'); ol.innerHTML = '';

    const k = document.createElement('span'); k.className = 'k'; k.style.background = logColor(e);
    const tm = document.createElement('time'); tm.textContent = dayhm(e.ts);
    const tx = document.createElement('span'); tx.textContent = logText(e);
    li.append(tm, k, tx); ol.appendChild(li);

// ------------------------------------------------------------------ power history (EM1Data: one record a minute)
const KI = {};   // key indexes of the EM1Data values
// reads the records from..to (s) page by page
async function fetchRange(from, to, onPage) {
  for (let guard = 0; guard < 400 && from <= to; guard++) {
    const r = await rpc.call('EM1Data.GetData', { id: 0, ts: from, end_ts: to });
    (r.keys || []).forEach((k, i) => { KI[k] = i; });
    for (const blk of r.data || []) {
      blk.values.forEach((v, i) => {
        const ts = blk.ts + i * blk.period;
        S.recs.set(ts, { e: v[KI.total_act_energy], mx: v[KI.max_act_power], mn: v[KI.min_act_power], u: v[KI.avg_voltage], p: blk.period });
        if (S.lastTs === null || ts > S.lastTs) S.lastTs = ts;
      });
    }
    if (!r.next_record_ts || r.next_record_ts <= from) break;
    from = r.next_record_ts;
    if (onPage) onPage();
  }
}
// first the range on screen, then the rest of the 7 days; later only the new minutes
async function loadHistory(full, reload) {
  if (!S.connected || S.histBusy) return;
  S.histBusy = true;
  try {
    const now = Math.floor(Date.now() / 1000);
    const first = S.lastTs === null;
    if (full || S.lastTs === null) {
      S.recs.clear(); S.lastTs = null; renderChart();
      // the range on screen first; the rest of the 7 days for the picture view's timeline
      const split = now - S.hours * 3600;
      await fetchRange(split, now, renderChart);
      renderChart();
      if (first) reloadCard();
      await fetchRange(now - 7 * 86400, split - 1, () => { if (S.hours * 3600 > now - split) renderChart(); });
    } else await fetchRange(S.lastTs + 60, now);
    const cut = now - 7 * 86400 - 3600;
    for (const ts of S.recs.keys()) if (ts < cut) S.recs.delete(ts);
    try { S.etotal = (await rpc.call('EM1Data.GetStatus', { id: 0 })).total_act_energy; } catch (e) { S.etotal = null; }
    S.histErr = null;
    if (full || first || reload) reloadCard();
  } catch (e) { S.histErr = String(e.message || e); }
  S.histBusy = false;
  renderChart();
}

// The power of a minute: the middle of its minimum and maximum when they are close. The minute
// energy of the Shelly comes in steps of about 0.207 Wh (12.4 W), so an average from it would jump.
// When the power changed during the minute: the energy average, kept between the minimum and maximum.
const minuteW = (r) => (r.mx - r.mn < 6 ? (r.mn + r.mx) / 2 : Math.min(r.mx, Math.max(r.mn, r.e * 3600 / r.p)));
// normalised to 230 V like in the script, so that the voltage does not move the levels
const normW = (p, u) => (p > 10 && u > 50 ? (p - 4) * (230 / u) * (230 / u) + 4 : p);

let chartPts = null;
function renderChart() {
  const svg = $('plot'), W = svg.clientWidth || 800, H = svg.clientHeight || 260;
  svg.setAttribute('viewBox', `0 0 ${W} ${H}`);
  const now = Date.now() / 1000, span = S.hours * 3600, t0 = now - span;
  const padL = 34, padR = 10, padT = 18, padB = 24, pw = W - padL - padR, ph = H - padT - padB;
  // one point a minute, or a 5-minute average over 3 days
  const bs = S.hours > 24 ? 300 : 60;
  const map = new Map(); let eSum = 0, sSum = 0;
  for (const [ts, r] of S.recs) {
    if (ts + r.p <= t0 || ts > now) continue;
    const k = Math.floor(ts / bs), w = minuteW(r), u = r.u || 230;
    const b = map.get(k) || { k, n: 0, w: 0, pn: 0, u: 0, t: k * bs + bs / 2 };
    b.n++; b.w += w; b.pn += normW(w, u); b.u += u; map.set(k, b);
    eSum += r.e; sSum += r.p;
  }
  const B = [...map.values()].sort((a, b) => a.k - b.k);
  let ymax = 70;
  for (const b of B) { b.w /= b.n; b.pn /= b.n; b.u /= b.n; ymax = Math.max(ymax, b.pn); }
  ymax = Math.ceil(ymax / 10) * 10;
  const x = (t) => padL + (Math.min(now, Math.max(t0, t)) - t0) / span * pw, y = (w) => padT + ph - w / ymax * ph;
  let o = '';
  const step = ymax > 100 ? 25 : 10, lstep = ymax > 100 ? 50 : 20;
  for (let w = 0; w <= ymax; w += step) {
    o += `<line class="grid-l" x1="${padL}" x2="${W - padR}" y1="${y(w).toFixed(1)}" y2="${y(w).toFixed(1)}"${w % lstep ? ' stroke-opacity=".45"' : ''}/>`;
    if (w % lstep === 0) o += `<text x="${padL - 6}" y="${(y(w) + 4).toFixed(1)}" text-anchor="end">${w}</text>`;
  }
  o += `<text x="${padL - 6}" y="${padT - 8}" text-anchor="end">W</text>`;
  // time ticks
  // at full local hours (stepped an hour at a time, so that a change of summer time keeps them right)
  const th = S.hours <= 6 ? 1 : S.hours <= 24 ? 4 : 6;
  const d = new Date(t0 * 1000); d.setMinutes(0, 0, 0);
  for (; d.getTime() <= now * 1000; d.setTime(d.getTime() + 3600e3)) {
    const t = d.getTime() / 1000;
    if (t < t0 || d.getHours() % th !== 0) continue;
    // over 3 days: the date at midnight, the time at the other ticks
    const lab = S.hours > 24 && d.getHours() === 0 ? d.toLocaleDateString(loc(), { weekday: 'short', day: 'numeric', month: 'numeric' }) : hm(t);
    o += `<line class="grid-l" x1="${x(t).toFixed(1)}" x2="${x(t).toFixed(1)}" y1="${padT}" y2="${padT + ph}" stroke-opacity=".5"/>`;
    o += `<text x="${x(t).toFixed(1)}" y="${H - 6}" text-anchor="middle">${lab}</text>`;
  }
  // the line, broken where minutes are missing
  let seg = [];
  const flush = () => {
    if (seg.length === 1) o += `<circle class="now" cx="${x(seg[0].t).toFixed(1)}" cy="${y(seg[0].pn).toFixed(1)}" r="1.2"/>`;
    else if (seg.length) o += `<polyline class="avg" points="${seg.map((b) => `${x(b.t).toFixed(1)},${y(b.pn).toFixed(1)}`).join(' ')}"/>`;
    seg = [];
  };
  for (let i = 0; i < B.length; i++) { if (i && B[i].k - B[i - 1].k > 1) flush(); seg.push(B[i]); }
  flush();
  // live power at the right edge
  if (S.connected && S.power !== null && now - S.powerAt < 30) o += `<circle class="now" cx="${x(now).toFixed(1)}" cy="${y(Math.min(normW(S.power, S.voltage), ymax)).toFixed(1)}" r="3.5"/>`;
  o += `<line class="cross" id="cross" x1="0" x2="0" y1="${padT}" y2="${padT + ph}" visibility="hidden"/>`;
  if (!B.length) o += `<text x="${(padL + pw / 2).toFixed(0)}" y="${(padT + ph / 2).toFixed(0)}" text-anchor="middle" style="font-size:13px">${esc(S.connected && (S.histBusy || S.lastTs === null) ? T.loading : S.histErr ? S.histErr : T.no_hist)}</text>`;
  svg.innerHTML = o;
  chartPts = { B, x, t0, span, padL, pw, W, bs };
  $('csum').textContent = sSum > 0 ? fmt(T.sum, { w: num(eSum * 3600 / sSum, 1), e: num(eSum / 1000, 2), d: S.hours > 24 ? fmt(T.per_day, { e: num(eSum / 1000 / (sSum / 86400), 2) }) : '' }) : ' ';
  for (const b of $('ranges').children) b.classList.toggle('on', Number(b.dataset.h) === S.hours);
}

function hover(ev) {
  const P = chartPts, tip = $('tip'), cross = document.getElementById('cross');
  if (!P || !cross || !P.B.length) return;
  const r = $('plot').getBoundingClientRect();
  const px = (ev.clientX - r.left) * (P.W / r.width);
  const t = P.t0 + (px - P.padL) / P.pw * P.span;
  let lo = 0, hi = P.B.length - 1;
  while (lo < hi) { const mid = (lo + hi) >> 1; if (P.B[mid].t < t) lo = mid + 1; else hi = mid; }
  if (lo > 0 && Math.abs(P.B[lo - 1].t - t) < Math.abs(P.B[lo].t - t)) lo--;
  const b = P.B[lo];
  if (px < P.padL || Math.abs(b.t - t) > P.bs * 3) { tip.style.display = 'none'; cross.setAttribute('visibility', 'hidden'); return; }
  cross.setAttribute('x1', P.x(b.t)); cross.setAttribute('x2', P.x(b.t)); cross.setAttribute('visibility', 'visible');
  const lab = S.hours > 24 ? new Date(b.t * 1000).toLocaleDateString(loc(), { weekday: 'short', day: 'numeric', month: 'numeric' }) + ' ' + hm(b.t) : hm(b.t);
  tip.textContent = fmt(T.tip, { t: lab, w: num(b.pn, 1), r: num(b.w, 1), u: num(b.u, 0) });
  tip.style.display = 'block';
  const wx = (P.x(b.t) / P.W) * r.width;
  tip.style.left = Math.min(Math.max(0, wx - tip.offsetWidth / 2), r.width - tip.offsetWidth) + 'px';
  tip.style.top = '4px';
}

// ------------------------------------------------------------------ connection
let retry = 0, retryT = null, pollT = null, histT = null, gen = 0;
async function connect() {
  clearTimeout(retryT); clearInterval(pollT); clearInterval(histT);
  rpc.close(); S.connected = false; S.err = null;
  const my = ++gen;
  if (!S.host) { setConn('', T.conn_none); openSettings(); return; }
  if (location.protocol === 'https:' && S.host !== window.__ucDemoHost) { setConn('bad', T.conn_bad); S.err = T.e_https; openSettings(); return; }
  setConn('wait', T.conn_wait);
  rpc.password = sessionPassword; rpc.ha1 = rpc.ha1 || store.get('ha1:' + S.host) || null;
  try {
    await rpc.open(S.host);
    if (my !== gen) return;
    S.info = await rpc.call('Shelly.GetDeviceInfo');
    if (S.info && S.info.id && rpc.ha1 === null && sessionPassword) rpc.ha1 = sha256('admin:' + S.info.id + ':' + sessionPassword);
    const list = await rpc.call('Script.List');
    const sc = (list.scripts || []).filter((s) => /^uponor[-_ ]?clean(?![-_ ]?app)/i.test(s.name || '')).sort((a, b) => b.running - a.running)[0];
    if (!sc || !sc.running) { S.scriptId = sc ? sc.id : null; setConn('bad', T.conn_noscript); S.err = T.e_noscript; renderInfo(); return; }
    S.scriptId = sc.id;
    if (rpc.ha1 && document.getElementById('d-rem').checked) store.set('ha1:' + S.host, rpc.ha1);
    S.connected = true; retry = 0; S.newSpan = true;
    if (H.host !== S.host) histLoad();
    // the keys of the script's components (for entering the chemical and the sludge from the picture)
    try { S.vc = JSON.parse((await rpc.call('KVS.Get', { key: 'uc_vc' })).value); } catch (e) { S.vc = null; }
    // the chemical per dose, if the script's settings change it (for the chemical history)
    S.doseL = 0.04;
    try { const c = JSON.parse((await rpc.call('KVS.Get', { key: 'uc_cfg' })).value); if (c && c.dose_l > 0) S.doseL = c.dose_l; } catch (e) { /* default */ }
    setConn('ok', T.conn_ok);
    addLog({ type: '_conn', ts: Date.now() / 1000 });
    await poll();
    pollT = setInterval(poll, 3000);
    // after a break only the minutes since the last one (the whole week takes ~35 s and keeps the Shelly busy)
    loadHistory(false, true);
    histT = setInterval(() => loadHistory(false), 60000);
  } catch (e) {
    if (my !== gen) return;
    rpc.close();
    if (e.code === 401) {
      setConn('bad', T.conn_auth); S.err = rpc.ha1 ? T.e_badpw : T.e_auth;
      rpc.ha1 = null; store.set('ha1:' + S.host, null); openSettings(true); return;
    }
    setConn('bad', T.conn_bad);
    scheduleRetry();
  }
}
function scheduleRetry() {
  clearTimeout(retryT);
  retry = Math.min(retry + 1, 6);
  retryT = setTimeout(connect, [0, 2, 4, 8, 15, 30, 30][retry] * 1000);
}
rpc.onClose = () => {
  if (!S.connected) return;
  S.connected = false; clearInterval(pollT); clearInterval(histT);
  addLog({ type: '_lost', ts: Date.now() / 1000 });
  setConn('bad', T.conn_bad); render(); renderChart();
  scheduleRetry();
};
rpc.onNotify = (m) => {
  if (m.method === 'NotifyEvent') {
    for (const e of (m.params && m.params.events) || []) {
      if (e.event !== 'uponor' || !e.data) continue;
      const d = Object.assign({}, e.data); d.ts = d.ts || e.ts || m.params.ts || Date.now() / 1000;
      addLog(d); histFromEvent(d);
      stateDue = true; clearTimeout(rpc.evT); rpc.evT = setTimeout(poll, 300);
    }
  } else if (m.method === 'NotifyStatus' && m.params && m.params['em1:0'] && typeof m.params['em1:0'].act_power === 'number') {
    S.power = m.params['em1:0'].act_power; S.powerAt = Date.now() / 1000;
    if (typeof m.params['em1:0'].voltage === 'number') S.voltage = m.params['em1:0'].voltage;
    render();
  }
};

// every 3 s: the power (unless the Shelly sent it), every 6 s or after an event: the script state
let pollBusy = false, pollN = 0, stateDue = true, pollFails = 0;
async function poll() {
  if (!S.connected || pollBusy) return;
  pollBusy = true;
  try {
    if (stateDue || pollN % 2 === 0) {
      stateDue = false;
      const r = await rpc.call('Script.Eval', { id: S.scriptId, code: 'JSON.stringify(stateObject())' });
      const s = typeof r.result === 'string' ? JSON.parse(r.result) : r.result;
      if (s && typeof s === 'object') { S.state = s; S.stateAt = Date.now(); S.err = null; pollFails = 0; histFromState(s); histSeen(s); }
    }
    pollN++;
    if (Date.now() / 1000 - S.powerAt > 2.5) {
      const em = await rpc.call('EM1.GetStatus', { id: 0 });
      if (em && typeof em.act_power === 'number') { S.power = em.act_power; S.voltage = em.voltage; S.powerAt = Date.now() / 1000; }
    }
  } catch (e) {
    if (S.connected) {
      S.err = fmt(T.e_eval, { m: e.message || e });
      // a connection that died without closing (e.g. a phone asleep): connect again
      if (++pollFails >= 3) {
        pollFails = 0; S.connected = false; clearInterval(pollT); clearInterval(histT); rpc.close();
        addLog({ type: '_lost', ts: Date.now() / 1000 }); setConn('bad', T.conn_bad); scheduleRetry();
      }
    }
  }
  pollBusy = false;
  render();
  if (pollN % 5 === 0) renderChart();
}

// ------------------------------------------------------------------ picture: the Home Assistant card
// The card (ha-card/uponor-clean-card.js, put in by app/tools/build_app.js) gets a stand-in for Home
// Assistant: the script's outputs as entity states, their history as observed by this browser
// (kept here for 8 days), the power history from the Shelly (EM1Data) and number.set_value as
// Number.Set on the script's components. The phases of the times this browser was not connected
// are read from the Shelly's minute power (app/history_from_power.js, put in by the build), so the
// timeline, the batches per day and the level estimate cover the past week on any device.
const HE = { power: 'sensor.uc_power', energy: 'sensor.uc_energy', phase: 'sensor.uc_phase', cycle: 'sensor.uc_cycle',
  warning: 'sensor.uc_warning', next_pumpout: 'sensor.uc_next_pump_out', batch_counter: 'number.uc_batches',
  chemical: 'number.uc_chemical', sludge: 'number.uc_sludge' };
const HKEYS = ['phase', 'cycle', 'warning', 'next_pumpout', 'batch_counter', 'chemical', 'sludge'];
const HKEEP = 8.5 * 86400e3;
// H.seen: the spans [start, end, first read] (ms) this browser was connected and read the script's state
let H = { host: null, s: {}, seen: [] }, histSaveT = null, seenSaved = 0;
function histLoad() {
  H = { host: S.host, s: {}, seen: [] };
  try {
    const j = JSON.parse(localStorage.getItem('uc_app_hist:' + S.host) || 'null');
    if (j && j.s) H.s = j.s;
    if (j && Array.isArray(j.seen)) H.seen = j.seen.filter((x) => Array.isArray(x) && x[1] >= x[0]);
  } catch (e) { /* none */ }
  for (const k of HKEYS) if (!Array.isArray(H.s[k])) H.s[k] = [];

  const list = (await slow('Script.List')).scripts || [];
  const parts = list.filter((s) => /^uponor-clean-app-data\d*$/.test(s.name || '')).sort((a, b) => partNo(a.name) - partNo(b.name));
  return { list, parts, loader: list.find((s) => s.name === NAME_LOADER) };
}

// writes this app and the loader on the Shelly; opts.partMax only for tests.
// An update deletes the old app data first and then writes the new one. The loader keeps its
// script number, so the app address stays the same.
async function installApp(opts) {
  opts = opts || {};
  SLOW = opts.timeout || 30000;   // opts.timeout only for tests
  const say = opts.progress || (() => {});
  const parts = await packApp(SELF_HTML, opts.partMax || PART_MAX);
  const total = parts.reduce((a, p) => a + p.length, 0) + LOADER_JS.length;
  const { parts: old, loader } = await shellyApp();
  let oldBytes = 0;
  for (const s of old) oldBytes += await codeSize(s.id);
  if (loader) oldBytes += await codeSize(loader.id);
  const sys = await slow('Sys.GetStatus');
  if (typeof sys.fs_free === 'number' && sys.fs_free + oldBytes - total < FS_KEEP) {
    throw Object.assign(new Error(fmt(T.inst_space, { f: kb(sys.fs_free + oldBytes), n: kb(total), k: kb(FS_KEEP) })), { noRetry: true });
  }
  const steps = parts.reduce((a, p) => a + Math.ceil(p.length / 1024), 0) + Math.ceil(LOADER_JS.length / 1024);
  let done = 0; const tick = () => say(Math.min(99, Math.round(++done / steps * 100)));
  for (const s of old) {
    if (s.running) await slow('Script.Stop', { id: s.id });
    await slow('Script.Delete', { id: s.id });
  }
  for (let i = 0; i < parts.length; i++) {
    const id = await createScript(partName(i));
    await slow('Script.SetConfig', { id, config: { enable: false } });
    await putCode(id, parts[i], tick);
  }
  const lid = loader ? loader.id : await createScript(NAME_LOADER);
  if (!(loader && loader.running && (await readCode(lid)) === LOADER_JS)) {
    if (loader && loader.running) await slow('Script.Stop', { id: lid });
    await putCode(lid, LOADER_JS, tick);
    await slow('Script.SetConfig', { id: lid, config: { enable: true } });
    try { await slow('Script.Start', { id: lid }); } catch (e) { throw Object.assign(new Error(fmt(T.inst_start, { m: e.message || e })), { noRetry: true }); }
  } else await slow('Script.SetConfig', { id: lid, config: { enable: true } });
  say(100);
  const after = await slow('Sys.GetStatus');
  return { url: 'http://' + S.host + '/script/' + lid + '/app', size: total, free: after.fs_free, parts: parts.length };
}

// deletes the app scripts (the data parts and the loader) from the Shelly
async function removeApp() {
  const { parts, loader } = await shellyApp();
  for (const s of loader ? parts.concat([loader]) : parts) {
    if (s.running) await slow('Script.Stop', { id: s.id });
    await slow('Script.Delete', { id: s.id });
  }
  return (await slow('Sys.GetStatus')).fs_free;
}

// shows in the settings what the Shelly has
async function checkInst() {
  const st = $('d-inst-s'), b = $('d-inst-b'), x = $('d-inst-x');
  b.textContent = T.inst_btn; x.textContent = T.inst_rm; x.hidden = true; rmArmed = false;
  if (!rpcOpen()) { st.textContent = T.inst_conn; b.disabled = true; return; }
  st.textContent = T.inst_check; b.disabled = true;
  try {
    const { parts, loader } = await shellyApp();
    x.hidden = !parts.length && !loader;
    if (!parts.length || !loader) st.textContent = T.inst_none;
    else {
      let text = ''; for (const p of parts) text += await readCode(p.id);
      const m = /APP_VERSION = '([^']+)'/.exec(await unpackApp(text)), v = m ? m[1] : '?';
      const url = 'http://' + S.host + '/script/' + loader.id + '/app';
      st.innerHTML = fmt(v === APP_VERSION ? T.inst_same : T.inst_have, { v: esc(v), url: link(url) }) + (loader.running ? '' : ' ' + esc(T.inst_stopped));
      b.textContent = v === APP_VERSION && loader.running ? T.inst_again : fmt(T.inst_upd, { v: APP_VERSION });
    }
  } catch (e) { st.textContent = fmt(T.inst_err, { m: String(e.message || e).replace(/\.$/, '') }); }
  b.disabled = false;
}
$('d-inst-b').addEventListener('click', async () => {
  if (instBusy || !rpcOpen()) return;
  instBusy = true; rmArmed = false;
  const st = $('d-inst-s'), b = $('d-inst-b'), x = $('d-inst-x');
  b.disabled = true; x.disabled = true; $('d-ok').disabled = true; x.textContent = T.inst_rm;
  try {
    const r = await installApp({ progress: (p) => { st.textContent = fmt(T.inst_busy, { p }); } });
    st.innerHTML = fmt(T.inst_done, { url: link(r.url), n: kb(r.size), f: kb(r.free) });
    b.textContent = T.inst_again; x.hidden = false;
  } catch (e) { st.textContent = fmt(T.inst_err, { m: String(e.message || e).replace(/\.$/, '') }) + (e.noRetry ? '' : T.inst_retry); }
  b.disabled = false; x.disabled = false; $('d-ok').disabled = false; instBusy = false;
});
// removal needs a second press within 5 s (no browser dialogs)
$('d-inst-x').addEventListener('click', async () => {
  if (instBusy || !rpcOpen()) return;
  const st = $('d-inst-s'), b = $('d-inst-b'), x = $('d-inst-x');
  if (!rmArmed) {
    rmArmed = true; x.textContent = T.inst_rm_ok;
    clearTimeout(rmT); rmT = setTimeout(() => { rmArmed = false; x.textContent = T.inst_rm; }, 5000);
    return;
  }
  clearTimeout(rmT); rmArmed = false; instBusy = true;
  b.disabled = true; x.disabled = true; $('d-ok').disabled = true;
  try {
    const free = await removeApp();
    st.textContent = fmt(T.inst_rm_done, { f: kb(free) });
    b.textContent = T.inst_btn; x.hidden = true;
  } catch (e) { st.textContent = fmt(T.inst_rm_err, { m: e.message || e }); }
  x.textContent = T.inst_rm; b.disabled = false; x.disabled = false; $('d-ok').disabled = false; instBusy = false;
});

// ------------------------------------------------------------------ start
$('ranges').addEventListener('click', (ev) => { const b = ev.target.closest('button'); if (!b) return; S.hours = Number(b.dataset.h); store.set('hours', String(S.hours)); renderChart(); });
$('plot').addEventListener('pointermove', hover);
$('plot').addEventListener('pointerleave', () => { $('tip').style.display = 'none'; const c = document.getElementById('cross'); if (c) c.setAttribute('visibility', 'hidden'); });
let rzT = null; window.addEventListener('resize', () => { clearTimeout(rzT); rzT = setTimeout(renderChart, 150); });
// A page in the background lets go of its connection after a minute: the Shelly takes only a few
// WebSocket clients at a time, and a new one closes another (often Home Assistant's).
let hideT = null;
document.addEventListener('visibilitychange', () => {
  clearTimeout(hideT);
  if (document.hidden) {
    histFlush();
    hideT = setTimeout(() => {
      if (!document.hidden || !S.connected) return;
      gen++; clearTimeout(retryT); clearInterval(pollT); clearInterval(histT);
      S.connected = false; rpc.close(); setConn('', T.conn_pause);
    }, 60000);
  } else if (!S.connected && S.host) { retry = 0; connect(); }
});
window.addEventListener('pagehide', () => histFlush());
setInterval(() => { if (S.state) render(); }, 15000);
setTexts(); renderLog(); renderInfo(); renderChart();
if (urlHost) store.set('host', urlHost);
histLoad(); applyView();
matchMedia('(prefers-color-scheme: dark)').addEventListener('change', feedCard);
connect();
window.__ucApp = { S, sha256, rpc, installApp, removeApp, checkInst, selfLength: SELF_HTML.length, hist: () => ({ H, view: histView() }) };   // for tests
})();
